name: Test and build
on:
  push:
    branches: [main]
  pull_request:
  # Lets a maintainer re-run the checks by hand when a run never fires.
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
